name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: [server/**, python-service/**, deploy/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b && npx vite build --base /citewise/
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      # GitHub Pages has no SPA routing; serve the app for unknown paths too.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
