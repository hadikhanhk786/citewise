# Production stack for one Oracle Cloud VM. The UI is served from GitHub Pages.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: citewise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: citewise
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citewise"]
      interval: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Keep models in memory: reloading costs seconds and drops the prompt cache.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot: downloads the models on first start, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull ${OLLAMA_CHAT_MODEL} && ollama pull ${OLLAMA_EMBED_MODEL}"]
    restart: "no"

  # Sends chat to a Kaggle GPU while one is registered (see kaggle/), else to local Ollama.
  gpu-router:
    build: ./gpu-router
    restart: unless-stopped
    depends_on: [ollama]
    environment:
      GPU_TOKEN: ${GPU_TOKEN}
      KAGGLE_CONFIG_DIR: /app/secrets
    volumes:
      - ../kaggle:/app/kernel:ro          # notebook + kernel-metadata.json pushed to Kaggle
      - ./kaggle-secrets:/app/secrets:ro  # put kaggle.json here to enable on-demand GPU

  rag:
    build: ../python-service
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # Separate database so Prisma (api) never touches the RAG tables.
      DATABASE_URL: postgresql+psycopg://citewise:${POSTGRES_PASSWORD}@postgres:5432/rag
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://gpu-router:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      # L2 distance cutoff on normalized vectors; nomic-embed-text matches score ~0.8-1.2,
      # so the default 0.75 (tuned for OpenAI/Gemini) drops every chunk.
      SIMILARITY_THRESHOLD: "1.25"
      LLM_TIMEOUT_SECONDS: "300"

  api:
    build: ../server
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://citewise:${POSTGRES_PASSWORD}@postgres:5432/citewise?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PY_AI_BASE_URL: http://rag:8000
      CORS_ORIGIN: ${CORS_ORIGIN}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api, gpu-router]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  postgres_data:
  ollama_data:
  caddy_data:
